services:
  # Gateway mode. Client id and secret arrive per request on
  # X-Alternative-Payments-* headers. Do not set
  # ALTERNATIVE_PAYMENTS_CLIENT_ID, ALTERNATIVE_PAYMENTS_CLIENT_SECRET, or
  # env_file here — that would put static vendor credentials in the
  # container. The project .env is used only for Compose interpolation.
  # For AUTH_MODE=env, pass ALTERNATIVE_PAYMENTS_CLIENT_ID and
  # ALTERNATIVE_PAYMENTS_CLIENT_SECRET on that process instead (see the README).
  alternative-payments-mcp:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=8080
      - MCP_HTTP_HOST=0.0.0.0
      - AUTH_MODE=gateway
      - CONDUIT_S2S_SECRET=${CONDUIT_S2S_SECRET:?set CONDUIT_S2S_SECRET}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
